name: CommitGuard

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:

  commitguard:
    name: CommitGuard

    uses: GhananilShirpurkar/CommitGuard/.github/workflows/commitguard-reusable.yml@main

    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COMMITGUARD_AI_API_KEY: ${{ secrets.COMMITGUARD_AI_API_KEY }}
      COMMITRUSH_API_KEY: ${{ secrets.COMMITRUSH_API_KEY }}