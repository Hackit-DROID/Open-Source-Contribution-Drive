name: CommitRush Slash Commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show event
        run: |
          echo "COMMENT RECEIVED"
          echo "User: ${{ github.event.comment.user.login }}"
          echo "Comment: ${{ github.event.comment.body }}"
          echo "Issue: ${{ github.event.issue.number }}"

      - name: Handle assign
        if: github.event.comment.body == '/assign'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const username = context.payload.comment.user.login;
            const issueNumber = context.issue.number;

            console.log(`Assigning #${issueNumber} to ${username}`);

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [username]
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `✅ @${username} has been assigned this issue.`
            });