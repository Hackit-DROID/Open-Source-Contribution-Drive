name: CommitRush Commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: read

jobs:
  commands:
    # Ignore comments that are not slash commands
    if: startsWith(github.event.comment.body, '/')
    runs-on: ubuntu-latest

    steps:
      - name: Handle CommitRush command
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const comment = context.payload.comment.body.trim();
            const username = context.payload.comment.user.login;
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            /*
             * -------------------------------------------------------
             * COMMAND PARSER
             * -------------------------------------------------------
             */

            const parts = comment.split(/\s+/);
            const command = parts[0].toLowerCase();

            /*
             * -------------------------------------------------------
             * HELPER: ADD COMMENT
             * -------------------------------------------------------
             */

            async function reply(message) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: message
              });
            }

            /*
             * -------------------------------------------------------
             * /assign
             * -------------------------------------------------------
             */

            if (command === '/assign') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const currentAssignees = issue.data.assignees || [];

              // Already assigned to this user
              if (
                currentAssignees.some(
                  user => user.login.toLowerCase() === username.toLowerCase()
                )
              ) {
                await reply(
                  `ℹ️ @${username}, you are already assigned to this issue.`
                );
                return;
              }

              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: [username]
              });

              await reply(
                `✅ @${username} has been assigned to this issue.`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /unassign
             * -------------------------------------------------------
             */

            if (command === '/unassign') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const isAssigned = (issue.data.assignees || []).some(
                user => user.login.toLowerCase() === username.toLowerCase()
              );

              if (!isAssigned) {
                await reply(
                  `ℹ️ @${username}, you are not assigned to this issue.`
                );
                return;
              }

              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: [username]
              });

              await reply(
                `✅ @${username} has been removed from this issue.`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /claim
             * -------------------------------------------------------
             */

            if (command === '/claim') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const assignees = issue.data.assignees || [];

              // Someone already owns the issue
              if (assignees.length > 0) {

                const alreadyAssigned = assignees.some(
                  user => user.login.toLowerCase() === username.toLowerCase()
                );

                if (alreadyAssigned) {
                  await reply(
                    `ℹ️ @${username}, you already claimed this issue.`
                  );
                } else {
                  const names = assignees
                    .map(user => `@${user.login}`)
                    .join(', ');

                  await reply(
                    `⚠️ This issue is already claimed by ${names}.`
                  );
                }

                return;
              }

              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: [username]
              });

              await reply(
                `🎯 @${username} claimed this issue. Good luck!`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /unclaim
             * -------------------------------------------------------
             */

            if (command === '/unclaim') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const assignees = issue.data.assignees || [];

              const isAssigned = assignees.some(
                user => user.login.toLowerCase() === username.toLowerCase()
              );

              if (!isAssigned) {
                await reply(
                  `ℹ️ @${username}, you haven't claimed this issue.`
                );
                return;
              }

              await github.rest.issues.removeAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: [username]
              });

              await reply(
                `✅ @${username} released this issue.`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /status
             * -------------------------------------------------------
             */

            if (command === '/status') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const assignees = issue.data.assignees || [];

              let assignment;

              if (assignees.length === 0) {
                assignment = '🟢 Unclaimed';
              } else {
                assignment = assignees
                  .map(user => `@${user.login}`)
                  .join(', ');
              }

              const labels = issue.data.labels
                .map(label => typeof label === 'string'
                  ? label
                  : label.name
                );

              await reply(
                `## 📊 CommitRush Status

                **Issue:** #${issueNumber}

                **Status:** ${issue.data.state === 'open' ? '🟢 Open' : '🔴 Closed'}

                **Assignee:** ${assignment}

                **Labels:** ${labels.length ? labels.join(', ') : 'None'}

                **Comments:** ${issue.data.comments}

                **CommitRush:** Active`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /points
             * -------------------------------------------------------
             */

            if (command === '/points') {

              const issue = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber
              });

              const body = issue.data.body || '';

              /*
               * Looks for:
               *
               * Suggested Points: 50
               *
               * or
               *
               * Points: 50
               */

              const match =
                body.match(/(?:Suggested Points|Points)\s*:\s*(\d+)/i);

              if (!match) {

                await reply(
                  `📊 @${username}, no CommitRush points value is defined for this issue.`
                );

                return;
              }

              const points = Number(match[1]);

              await reply(
                `🏆 **CommitRush Points**

                Issue #${issueNumber}

                **Base Points:** ${points}

                > Final points may be adjusted according to CommitRush contribution rules and multipliers.`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /rules
             * -------------------------------------------------------
             */

            if (command === '/rules') {

              await reply(
                `## 📜 CommitRush Rules

                **1. Claim before working**
                Use \`/claim\` before starting an issue.

                **2. One issue at a time**
                Do not work on an issue already claimed by another contributor.

                **3. Follow the issue scope**
                Changes should stay within the project specified by the issue.

                **4. No spam**
                Meaningless commits, unnecessary changes, or contribution farming may be rejected.

                **5. PR validation**
                Every PR is reviewed and validated before points are awarded.

                **6. Points**
                Points depend on issue difficulty, contribution type, quality, and applicable CommitRush multipliers.

                **7. Security**
                Never commit API keys, passwords, tokens, or other secrets.

                Good luck and contribute responsibly. 🚀`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * /help
             * -------------------------------------------------------
             */

            if (command === '/help') {

              await reply(
                `## 🤖 CommitRush Commands

                | Command | Description |
                |---|---|
                | \`/assign\` | Assign the issue to yourself |
                | \`/unassign\` | Remove yourself from the issue |
                | \`/claim\` | Claim an unclaimed issue |
                | \`/unclaim\` | Release an issue |
                | \`/status\` | Show issue status |
                | \`/points\` | Show issue's base points |
                | \`/rules\` | Show CommitRush rules |
                | \`/help\` | Show available commands |

                **Example:**
                \`\`\`
                /claim
                \`\`\`

                Happy contributing! 🚀`
              );

              return;
            }

            /*
             * -------------------------------------------------------
             * UNKNOWN COMMAND
             * -------------------------------------------------------
             */

            const knownCommands = [
              '/assign',
              '/unassign',
              '/claim',
              '/unclaim',
              '/status',
              '/points',
              '/rules',
              '/help'
            ];

            // Don't respond to random slash commands.
            // Only respond if it looks like a CommitRush command.
            if (
              command.startsWith('/commit') ||
              command.startsWith('/cr')
            ) {
              await reply(
                `❌ Unknown CommitRush command: \`${command}\`

                Use \`/help\` to see available commands.`
              );
            }