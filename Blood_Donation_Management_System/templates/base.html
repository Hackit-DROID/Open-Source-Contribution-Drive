<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>{% block title %}Blood Management{% endblock %}</title>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'dashboard' %}">BloodBank</a>
    <div class="d-flex">
      {% if user.is_authenticated %}
        <a class="btn btn-light btn-sm me-2" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="btn btn-light btn-sm me-2" href="{% url 'hospital_list' %}">Hospitals</a>
        <a class="btn btn-light btn-sm me-2" href="{% url 'stock_list' %}">Stocks</a>
        <a class="btn btn-light btn-sm me-2" href="{% url 'donor_list' %}">Donors</a>
        <a class="btn btn-light btn-sm me-2" href="{% url 'donation_list' %}">Donations</a>
        <a class="btn btn-light btn-sm me-2" href="{% url 'request_list' %}">Requests</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">{% csrf_token %}
          <button class="btn btn-dark btn-sm">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-light btn-sm" href="{% url 'login' %}">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container mt-4">
  {% if messages %}{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
