{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between">
  <h3>Donations</h3>
  <a class="btn btn-danger" href="{% url 'add_donation' %}">Record Donation</a>
</div>
<div class="card p-3 mt-2">
  <table class="table">
    <thead><tr><th>ID</th><th>Donor</th><th>Hospital</th><th>Sample</th><th>Units</th><th>Date</th></tr></thead>
    <tbody>
    {% for d in donations %}
      <tr><td>{{ d.id }}</td><td>{{ d.donor.name }}</td><td>{{ d.hospital.name }}</td><td>{{ d.blood_sample.blood_sample_id }}</td><td>{{ d.units }}</td><td>{{ d.donated_at }}</td></tr>
    {% empty %}<tr><td colspan="6">No donations</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
