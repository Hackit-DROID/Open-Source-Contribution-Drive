{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between">
  <h3>Donors</h3>
  <a class="btn btn-danger" href="{% url 'add_donor' %}">Add Donor</a>
</div>
<div class="card p-3 mt-2">
  <table class="table">
    <thead><tr><th>Name</th><th>Group</th><th>Contact</th><th>City</th><th>Actions</th></tr></thead>
    <tbody>
    {% for donor in donors %}
      <tr><td>{{ donor.name }}</td><td>{{ donor.blood_group }}</td><td>{{ donor.contact }}</td><td>{{ donor.city }}</td>
      <td><a class="btn btn-sm btn-secondary" href="{% url 'edit_donor' donor.id %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'delete_donor' donor.id %}">Delete</a></td></tr>
    {% empty %}<tr><td colspan="5">No donors</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
