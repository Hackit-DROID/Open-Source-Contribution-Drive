{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between">
  <h3>Stocks</h3>
  <a class="btn btn-danger" href="{% url 'add_stock' %}">Add Stock</a>
</div>
<div class="card p-3 mt-2">
  <table class="table">
    <thead><tr><th>ID</th><th>Group</th><th>Units</th><th>Hospital</th><th>Actions</th></tr></thead>
    <tbody>
    {% for s in stocks %}
      <tr><td>{{ s.blood_sample_id }}</td><td>{{ s.blood_group }}</td><td>{{ s.units }}</td><td>{{ s.hospital.name }}</td>
      <td><a class="btn btn-sm btn-secondary" href="{% url 'edit_stock' s.blood_sample_id %}">Edit</a>
          <a class="btn btn-sm btn-danger" href="{% url 'delete_stock' s.blood_sample_id %}">Delete</a></td></tr>
    {% empty %}<tr><td colspan="5">No stocks</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
