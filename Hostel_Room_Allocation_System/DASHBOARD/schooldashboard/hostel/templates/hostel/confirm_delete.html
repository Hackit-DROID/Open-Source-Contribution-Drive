<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Hostel Record</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-red-500 to-red-700 min-h-screen text-white flex justify-center items-center">
  <div class="bg-white text-black p-10 rounded-lg shadow-lg text-center">
    <h2 class="text-2xl font-bold mb-4">⚠️ Are you sure you want to delete <span class="text-red-600">{{ object.student_name }}</span>?</h2>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-700 transition">Yes, Delete</button>
      <a href="{% url 'hostel_display' %}" class="ml-4 text-gray-700 hover:underline">Cancel</a>
    </form>
  </div>
</body>
</html>
