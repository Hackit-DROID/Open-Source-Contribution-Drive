<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mess Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-500 to-emerald-600 min-h-screen text-white">
  <div class="container mx-auto p-8">
    <h1 class="text-4xl font-bold mb-6 text-center">🍽 Mess Dashboard</h1>
    <a href="{% url 'mess_add' %}" class="bg-yellow-400 text-black px-4 py-2 rounded-lg hover:bg-yellow-500">+ Add Record</a>
    <div class="overflow-x-auto mt-6 bg-white text-black rounded-lg shadow-lg">
      <table class="min-w-full border border-gray-300">
        <thead class="bg-gray-100 text-gray-800">
          <tr>
            <th class="px-4 py-2">Student</th>
            <th class="px-4 py-2">Meal Type</th>
            <th class="px-4 py-2">Month</th>
            <th class="px-4 py-2">Days Attended</th>
            <th class="px-4 py-2">Charge/Day</th>
            <th class="px-4 py-2">Total</th>
            <th class="px-4 py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for m in meals %}
          <tr class="hover:bg-gray-200 transition">
            <td class="px-4 py-2">{{ m.student_name }}</td>
            <td class="px-4 py-2">{{ m.meal_type }}</td>
            <td class="px-4 py-2">{{ m.month }}</td>
            <td class="px-4 py-2">{{ m.attended_days }}/{{ m.total_days }}</td>
            <td class="px-4 py-2">₹{{ m.charge_per_day }}</td>
            <td class="px-4 py-2">₹{{ m.total_bill }}</td>
            <td class="px-4 py-2 space-x-2">
              <a href="{% url 'mess_edit' m.id %}" class="text-blue-600 hover:underline">Edit</a>
              <a href="{% url 'mess_delete' m.id %}" class="text-red-600 hover:underline">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
