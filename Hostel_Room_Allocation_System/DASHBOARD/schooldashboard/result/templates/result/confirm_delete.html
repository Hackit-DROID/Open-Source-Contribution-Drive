<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Result</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff7675, #d63031);
            color: #fff;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            background: #ffffff1a;
            width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(8px);
        }
        button {
            background: #d63031;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #e17055;
            transform: scale(1.05);
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #ffeaa7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Are you sure you want to delete <br> <b>{{ object.name }}</b>?</h2>
        <form method="post">{% csrf_token %}
            <button type="submit">Yes, Delete</button>
        </form>
        <a href="{% url 'result_display' %}">Cancel</a>
    </div>
</body>
</html>
