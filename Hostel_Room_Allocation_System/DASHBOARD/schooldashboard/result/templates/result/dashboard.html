<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 to-cyan-600 min-h-screen text-white">
  <div class="container mx-auto p-8">
    <h1 class="text-4xl font-bold mb-6 text-center">📊 Result Dashboard</h1>
    <a href="{% url 'result_add' %}" class="bg-green-400 text-black px-4 py-2 rounded-lg hover:bg-green-500">+ Add Result</a>
    <div class="overflow-x-auto mt-6 bg-white text-black rounded-lg shadow-lg">
      <table class="min-w-full border border-gray-300">
        <thead class="bg-gray-100 text-gray-800">
          <tr>
            <th class="px-4 py-2">Student</th>
            <th class="px-4 py-2">Reg No</th>
            <th class="px-4 py-2">Semester</th>
            <th class="px-4 py-2">Subject</th>
            <th class="px-4 py-2">Marks</th>
            <th class="px-4 py-2">Grade</th>
            <th class="px-4 py-2">Status</th>
            <th class="px-4 py-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for r in results %}
          <tr class="hover:bg-gray-200 transition">
            <td class="px-4 py-2">{{ r.student_name }}</td>
            <td class="px-4 py-2">{{ r.regno }}</td>
            <td class="px-4 py-2">{{ r.semester }}</td>
            <td class="px-4 py-2">{{ r.subject }}</td>
            <td class="px-4 py-2">{{ r.marks }}</td>
            <td class="px-4 py-2">{{ r.grade }}</td>
            <td class="px-4 py-2">{{ r.status }}</td>
            <td class="px-4 py-2 space-x-2">
              <a href="{% url 'result_edit' r.id %}" class="text-blue-600 hover:underline">Edit</a>
              <a href="{% url 'result_delete' r.id %}" class="text-red-600 hover:underline">Delete</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
