<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ view.object|default:"Add Result" }}</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: #fff;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: #ffffff1a;
            border-radius: 20px;
            width: 400px;
            margin: auto;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            background: #ffffffcc;
            font-size: 16px;
        }
        button {
            background: #6c5ce7;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #341f97;
            transform: scale(1.05);
        }
        a {
            color: #fdcb6e;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{ view.object|default:"Add Result" }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
        <br>
        <a href="{% url 'result_display' %}">← Back to Results</a>
    </div>
</body>
</html>
