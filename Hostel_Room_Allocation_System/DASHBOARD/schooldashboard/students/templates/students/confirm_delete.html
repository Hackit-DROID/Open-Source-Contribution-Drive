<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Student</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hover-glow:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transform: translateY(-3px);
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-teal-50 via-emerald-100 to-green-50 min-h-screen flex items-center justify-center font-sans p-6">

  <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-md w-full text-center fade-in border border-emerald-200">
    <h2 class="text-2xl font-extrabold text-emerald-700 mb-4">
      ⚠️ Delete Confirmation
    </h2>
    <p class="text-gray-700 mb-8">
      Are you sure you want to delete <span class="font-semibold text-emerald-600">{{ object.name }}</span>?
      <br>This action <span class="font-semibold text-red-600">cannot be undone</span>.
    </p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div class="flex justify-center gap-4">
        <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg font-semibold shadow hover-glow transition-all duration-200">
          🚫 Yes, Delete
        </button>
        <a href="{% url 'display' %}"
           class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-6 py-2 rounded-lg font-semibold transition-all duration-200 hover-glow">
          ↩️ Cancel
        </a>
      </div>
    </form>
  </div>
</body>
</html>
