<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ view.object|default:"Add Student" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hover-glow:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      transform: translateY(-2px);
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gradient-to-br from-teal-50 via-emerald-100 to-green-50 min-h-screen flex items-center justify-center font-sans p-4">

  <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-2xl max-w-lg w-full fade-in border border-emerald-200">
    <h2 class="text-3xl font-extrabold text-center text-emerald-700 mb-6">
      {{ view.object|default:"➕ Add Student" }}
    </h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <!-- Django form rendered neatly -->
      <div class="space-y-3">
        {{ form.non_field_errors }}
        {% for field in form %}
          <div>
            <label for="{{ field.id_for_label }}" class="block text-gray-700 font-medium mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <p class="text-red-600 text-sm mt-1">{{ field.errors|striptags }}</p>
            {% endif %}
          </div>
        {% endfor %}
      </div>

      <!-- Style Django form inputs -->
      <script>
        document.addEventListener("DOMContentLoaded", () => {
          const inputs = document.querySelectorAll("input, select, textarea");
          inputs.forEach(el => {
            el.classList.add(
              "w-full", "border", "border-emerald-300", "rounded-lg",
              "px-4", "py-2", "focus:ring-2", "focus:ring-emerald-400",
              "focus:outline-none", "transition-all", "duration-200"
            );
          });
        });
      </script>

      <!-- Buttons -->
      <div class="flex justify-between items-center pt-4">
        <a href="{% url 'display' %}"
           class="text-gray-600 hover:text-emerald-700 underline font-medium transition-all duration-200">
          ← Back
        </a>
        <button type="submit"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-lg font-semibold shadow hover-glow transition-all duration-200">
          💾 Save
        </button>
      </div>
    </form>
  </div>

</body>
</html>
