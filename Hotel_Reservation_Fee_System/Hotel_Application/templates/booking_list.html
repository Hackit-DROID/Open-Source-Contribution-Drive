<!DOCTYPE html>
<html>
<head>
    <title>Booking List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<h1>Bookings</h1>
<table>
    <tr>
        <th>Guest</th>
        <th>Room</th>
        <th>Check-In</th>
        <th>Check-Out</th>
        <th>Status</th>
        <th>Hotel</th>
    </tr>
    {% for b in bookings %}
    <tr>
        <td>{{ b.guest.name }}</td>
        <td>{{ b.room.room_number }}</td>
        <td>{{ b.check_in }}</td>
        <td>{{ b.check_out }}</td>
        <td>{{ b.status }}</td>
        <td>{{ b.hotel.name }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
