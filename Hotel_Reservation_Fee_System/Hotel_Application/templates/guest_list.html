<!DOCTYPE html>
<html>
<head>
    <title>Guest List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Guest List</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Hotel</th>
        </tr>
        {% for g in guests %}
        <tr>
            <td>{{ g.name }}</td>
            <td>{{ g.email }}</td>
            <td>{{ g.phone }}</td>
            <td>{{ g.hotel.name }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
