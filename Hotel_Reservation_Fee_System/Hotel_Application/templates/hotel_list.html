<!DOCTYPE html>
<html>
<head>
    <title>Guest List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>Hotels</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Location</th>
        <th>Rating</th>
    </tr>
    {% for h in hotels %}
    <tr>
        <td>{{ h.name }}</td>
        <td>{{ h.location }}</td>
        <td>{{ h.rating }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
