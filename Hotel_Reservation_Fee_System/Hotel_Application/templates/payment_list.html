<!DOCTYPE html>
<html>
<head>
    <title>Booking List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<h1>Payments</h1>
<table>
    <tr>
        <th>Booking</th>
        <th>Amount Paid</th>
        <th>Payment Date</th>
        <th>Payment Method</th>
        <th>Hotel</th>
    </tr>
    {% for p in payments %}
    <tr>
        <td>{{ p.booking.guest.name }} (Room {{ p.booking.room.room_number }})</td>
        <td>{{ p.amount_paid }}</td>
        <td>{{ p.payment_date }}</td>
        <td>{{ p.payment_method }}</td>
        <td>{{ p.hotel.name }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
