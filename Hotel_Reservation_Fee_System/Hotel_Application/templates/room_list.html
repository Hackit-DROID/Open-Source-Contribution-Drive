<!DOCTYPE html>
<html>
<head>
    <title>Guest List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<h1>Rooms</h1>
<table>
    <tr>
        <th>Room Number</th>
        <th>Type</th>
        <th>Price (per night)</th>
        <th>Available</th>
        <th>Hotel</th>
    </tr>
    {% for r in rooms %}
    <tr>
        <td>{{ r.room_number }}</td>
        <td>{{ r.room_type }}</td>
        <td>{{ r.price_per_night }}</td>
        <td>{{ r.is_available }}</td>
        <td>{{ r.hotel.name }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
