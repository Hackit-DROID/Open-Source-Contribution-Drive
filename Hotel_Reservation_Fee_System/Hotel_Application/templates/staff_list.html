<!DOCTYPE html>
<html>
<head>
    <title>Guest List</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: center;
        }
        th {
            background: #f2f2f2;
        }
        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
<h1>Staff</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Hotel</th>
    </tr>
    {% for s in staff %}
    <tr>
        <td>{{ s.name }}</td>
        <td>{{ s.role }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.phone }}</td>
        <td>{{ s.hotel.name }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
