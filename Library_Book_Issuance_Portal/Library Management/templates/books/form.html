{% extends "base.html" %}
{% block title %}{{ title }} - SGGS Library{% endblock %}
{% block content %}
<div class="card" style="max-width: 640px;">
    <h2>{{ title }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Save</button>
        <a href="{% url 'books:list' %}" class="btn btn-muted">Cancel</a>
    </form>
    <p style="margin-top: 0.8rem; font-size: 0.85rem; color: #667;">
        A short AI summary and tags will be auto-generated from the description on save (if Gemini is configured).
    </p>
</div>
{% endblock %}
