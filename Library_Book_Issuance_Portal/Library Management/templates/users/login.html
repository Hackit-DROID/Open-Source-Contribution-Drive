{% extends "base.html" %}
{% block title %}Login - SGGS Library{% endblock %}
{% block content %}
<div class="card" style="max-width: 440px; margin: 0 auto;">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if form.errors %}
            <p class="msg msg-error">Invalid username or password.</p>
        {% endif %}
        <button type="submit" class="btn">Sign in</button>
    </form>
    <p>No account? <a href="{% url 'users:register' %}">Register as a student</a>.</p>
</div>
{% endblock %}
