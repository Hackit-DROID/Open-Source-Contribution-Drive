<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostel Records</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            font-weight: bold;
        }
        .btn-custom {
            background-color: #ff6600;
            color: white;
            border-radius: 25px;
            padding: 8px 20px;
            text-decoration: none;
        }
        .btn-custom:hover {
            background-color: #cc5200;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-4 text-dark">🏠 Hostel Records</h2>
        <table class="table table-hover table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Reg No</th>
                    <th>Hostel Name</th>
                    <th>Room No</th>
                </tr>
            </thead>
            <tbody>
                {% for hostel in hostels %}
                <tr>
                    <td>{{ hostel.regno }}</td>
                    <td>{{ hostel.hostel_name }}</td>
                    <td>{{ hostel.room_no }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted">No hostel records found</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div class="mt-3">
            <a href="/" class="btn btn-custom">🏠 Back to Home</a>
        </div>
    </div>
</body>
</html>
