<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        .btn {
            display: inline-block;
            padding: 8px 14px;
            margin: 10px 0;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
        .btn:hover {
            background: #45a049;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #4CAF50;
            color: white;
        }
        tr:hover {
            background: #f1f1f1;
        }
        .action a {
            margin: 0 5px;
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
        }
        .edit { background: #2196F3; }
        .edit:hover { background: #0b7dda; }
        .delete { background: #f44336; }
        .delete:hover { background: #da190b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Student Records</h1>
        <a class="btn" href="{% url 'student_create' %}">➕ Add New Student</a>

        <table>
            <tr>
                <th>Reg No</th>
                <th>Name</th>
                <th>Branch</th>
                <th>Year</th>
                <th>CET</th>
                <th>Actions</th>
            </tr>
            {% for student in students %}
            <tr>
                <td>{{ student.regno }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.branch }}</td>
                <td>{{ student.year }}</td>
                <td>{{ student.cet }}</td>
                <td class="action">
                    <a class="edit" href="{% url 'student_update' student.pk %}">✏️ Edit</a>
                    <a class="delete" href="{% url 'student_delete' student.pk %}">🗑️ Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
