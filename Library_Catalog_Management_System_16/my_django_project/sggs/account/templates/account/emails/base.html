<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ library_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#222;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:6px;">
        <tr>
            <td style="padding:20px 24px;background:#2c3e50;color:#ffffff;border-radius:6px 6px 0 0;">
                <h1 style="margin:0;font-size:20px;">{{ library_name }}</h1>
            </td>
        </tr>
        <tr>
            <td style="padding:24px;font-size:15px;line-height:1.5;">
                <p>Hello {{ user_name|default:"reader" }},</p>
                {% block content %}{% endblock %}
            </td>
        </tr>
        <tr>
            <td style="padding:16px 24px;font-size:12px;color:#777;border-top:1px solid #eee;">
                This is an automated message from {{ library_name }}. Please do not reply.
            </td>
        </tr>
    </table>
</body>
</html>
