<!DOCTYPE html>
<html>
<head>
    <title>Hostel Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 8px;
            width: 250px;
        }
        button {
            padding: 8px 12px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #007BFF;
            color: white;
        }
        th a {
            color: white;
            text-decoration: none;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Hostel Records</h1>

    <!-- 🔎 Search Form -->
    <form method="get">
        <input type="text" name="q" placeholder="Search by regno/hostel/room" value="{{ search_query }}">
        <button type="submit">Search</button>
    </form>

    <table>
        <tr>
            <th><a href="?sort=regno{% if search_query %}&q={{ search_query }}{% endif %}">Reg. No</a></th>
            <th><a href="?sort=hostel_name{% if search_query %}&q={{ search_query }}{% endif %}">Hostel Name</a></th>
            <th><a href="?sort=room_no{% if search_query %}&q={{ search_query }}{% endif %}">Room No</a></th>
        </tr>
        {% for h in hostels %}
        <tr>
            <td>{{ h.regno }}</td>
            <td>{{ h.hostel_name }}</td>
            <td>{{ h.room_no }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No hostel records found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
