<!DOCTYPE html>
<html>
<head>
    <title>Library Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #007BFF;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .no-data {
            text-align: center;
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Library Records</h1>
    <!-- 🔍 Search & Sort Form -->
    <form method="get">
        <input type="text" name="q" placeholder="Search by RegNo or Book" value="{{ search_query }}">
        <select name="sort">
            <option value="regno" {% if sort_by == "regno" %}selected{% endif %}>Reg No</option>
            <option value="book_name" {% if sort_by == "book_name" %}selected{% endif %}>Book Name</option>
            <option value="date_issue" {% if sort_by == "date_issue" %}selected{% endif %}>Date Issued</option>
            <option value="date_return" {% if sort_by == "date_return" %}selected{% endif %}>Date Return</option>
        </select>
        <button type="submit">Search & Sort</button>
    </form>

    <!-- 📚 Table -->
    <table>
        <tr>
            <th>Reg No</th>
            <th>Book Name</th>
            <th>Date Issued</th>
            <th>Date Return</th>
        </tr>
        {% for lib in libraries %}
        <tr>
            <td>{{ lib.regno }}</td>
            <td>{{ lib.book_name }}</td>
            <td>{{ lib.date_issue }}</td>
            <td>{{ lib.date_return }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No records found</td></tr>
        {% endfor %}
    </table>
</body>
</html>
