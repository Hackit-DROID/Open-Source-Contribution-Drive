<!DOCTYPE html>
<html>
<head>
    <title>SGGS College </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #fa0808; color: white; padding: 10px 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { padding: 20px; }
        .card { background: white; padding: 15px; margin: 10px; display: inline-block; width: 18%; vertical-align: top; border-radius: 5px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <header>
        <h1>SGGS College MIS</h1>
        <nav>
            <a href="/">Dashboard</a>
            <a href="/students/">Students</a>
            <a href="/hostels/">Hostels</a>
            <a href="/library/">Library</a>
            <a href="/accounts/">Accounts</a>
            <a href="/faculties/">Faculty</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
