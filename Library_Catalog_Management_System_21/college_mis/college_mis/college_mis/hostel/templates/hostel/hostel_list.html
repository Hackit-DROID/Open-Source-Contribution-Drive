{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hostels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Hostel List</h2>
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Student</th>
                <th>Room No</th>
                <th>Block</th>
                <th>Warden Name</th>
            </tr>
        </thead>
        <tbody>
        {% for hostel in hostels %}
            <tr>
                <td>{{ hostel.student.name }}</td>
                <td>{{ hostel.room_no }}</td>
                <td>{{ hostel.block }}</td>
                <td>{{ hostel.warden_name }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4">No hostels found.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
