<!DOCTYPE html>
<html>
<head>
    <title>Library Records</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f7;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 20px;
        }
        table {
            width: 90%;
            margin: 0 auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
        }
        th {
            background: #2196F3;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        tr:hover {
            background: #dceefd;
        }
    </style>
</head>
<body>
    <h1>Library Records</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Reg No</th>
            <th>Book Title</th>
            <th>Issue Date</th>
            <th>Return Date</th>
            <th>Fine</th>
        </tr>
        {% for record in libraries %}
        <tr>
            <td>{{ record.id }}</td>
            <td>{{ record.student }}</td>
            <td>{{ record.regno }}</td>
            <td>{{ record.book_title }}</td>
            <td>{{ record.issue_date }}</td>
            <td>{{ record.return_date }}</td>
            <td>{{ record.fine }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
