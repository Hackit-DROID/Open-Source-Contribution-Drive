<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Hostel & Library App{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">HostelLibrary</a>
    <div>
      <a class="nav-link d-inline" href="{% url 'student_list' %}">Students</a>
      <a class="nav-link d-inline" href="{% url 'account_list' %}">Accounts</a>
      <a class="nav-link d-inline" href="{% url 'library_list' %}">Library</a>
      <a class="nav-link d-inline" href="/admin/">Admin</a>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

</body>
</html>
