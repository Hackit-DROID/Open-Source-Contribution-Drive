{% extends 'students/base.html' %}

{% block title %}Admin Login - Student MIS{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-100 align-items-center">
        <div class="col-md-6 col-lg-5 mx-auto">
            <div class="card">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--primary-color);"></i>
                        <h2 class="mt-3">Admin Login</h2>
                        <p class="text-muted">Sign in to access the admin panel</p>
                    </div>

                    <form method="POST" action="{% url 'admin_login' %}">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i> Username
                            </label>
                            <input type="text" class="form-control form-control-lg" 
                                   id="username" name="username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i> Password
                            </label>
                            <input type="password" class="form-control form-control-lg" 
                                   id="password" name="password" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <a href="{% url 'home' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left"></i> Back to Home
                        </a>
                    </div>

                    <div class="alert alert-info mt-4 small">
                        <i class="fas fa-info-circle"></i> 
                        <strong>Default Admin Credentials:</strong><br>
                        Username: admin<br>
                        Password: admin123
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
