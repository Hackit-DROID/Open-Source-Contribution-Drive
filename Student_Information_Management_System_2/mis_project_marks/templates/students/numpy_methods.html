<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NumPy Methods</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f7f7f7;
            margin: 0;
        }

        nav {
            background: #1780f0;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #ffd700;
        }

        h1 {
            text-align: center;
            color: #1780f0;
            margin: 20px 0;
        }

        .search-container {
            width: 80%;
            margin: 20px auto;
            text-align: center;
        }
        .search-container input[type="text"] {
            padding: 8px;
            width: 250px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .search-container button {
            padding: 8px 12px;
            background: #1780f0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .search-container button:hover {
            background: #0f5ac1;
        }

        .table-container {
            width: 80%;
            margin: auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
        }

        tr:nth-child(even) td {
            background: #f9f9f9;
        }

        tr:hover td {
            background: #f0f8ff;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'all_students' %}">All Students</a>
        <a href="{% url 'toppers' %}">Toppers</a>
        <a href="{% url 'student_reports' %}">Student Reports</a>
        <a href="{% url 'numpy_methods' %}">NumPy Methods</a>
    </nav>

    <h1>NumPy Methods</h1>

    <!-- Search Form -->
    <div class="search-container">
        <form method="get" action="{% url 'numpy_methods' %}">
            <input type="text" name="search" placeholder="Search NumPy method..." value="{{ search_query }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Method Name</th>
                </tr>
            </thead>
            <tbody>
                {% for method in methods %}
                <tr>
                    <td>{{ method }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td>No methods found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
