<!DOCTYPE html>
<html>
<head>
    <title>Student Records</title>
    <style>
/* Students Page - Teal Theme */
body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 20px;
    background-color: #f4fdfb;
    color: #2c3e50;
}

h2 {
    text-align: center;
    color: #145a32;
    margin-bottom: 20px;
}

/* Table */
table {
    width: 85%;
    margin: auto;
    border-collapse: collapse;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    background: white;
    border-radius: 8px;
    overflow: hidden;
}

th, td {
    padding: 12px;
    text-align: center;
    border: 1px solid #ddd;
}

th {
    background-color: #16a085;
    color: white;
    font-size: 16px;
}

tr:nth-child(even) {
    background-color: #e8f8f5;
}

tr:nth-child(odd) {
    background-color: #ffffff;
}

tr:hover {
    background-color: #1abc9c;
    color: white;
    transition: 0.3s;
}

/* Search Box */
.search-box {
    width: 60%;
    margin: 20px auto;
    display: flex;
    justify-content: center;
}

.search-box input[type="text"] {
    flex: 1;
    padding: 10px;
    border: 2px solid #16a085;
    border-right: none;
    border-radius: 6px 0 0 6px;
    outline: none;
    font-size: 15px;
}

.search-box input[type="text"]:focus {
    border-color: #1abc9c;
    box-shadow: 0 0 6px rgba(26,188,156,0.4);
}

.search-box button {
    padding: 10px 20px;
    border: 2px solid #16a085;
    background: #16a085;
    color: white;
    cursor: pointer;
    border-radius: 0 6px 6px 0;
    transition: 0.3s;
    font-size: 15px;
}

.search-box button:hover {
    background: #1abc9c;
    border-color: #1abc9c;
}
    </style>
</head>
<body>
    <h2>📚 Records in Student Table</h2>

    <!-- Search box -->
    <div class="search-box">
      <form method="GET" action="{% url 'student_list' %}" style="display: flex; width: 100%;">
        <input type="text" name="q" placeholder="Search by name or branch..." value="{{ request.GET.q }}">
        <button type="submit">Search</button>
      </form>
    </div>

    <!-- Student Records Table -->
    <table>
        <tr>
            <th>Reg No</th>
            <th>Student Name</th>
            <th>Branch</th>
            <th>Physics</th>
            <th>Chemistry</th>
            <th>Math</th>
        </tr>
        {% for s in students %}
        <tr>
            <td>{{ s.regno }}</td>
            <td>{{ s.student_name }}</td>
            <td>{{ s.branch }}</td>
            <td>{{ s.phy }}</td>
            <td>{{ s.chem }}</td>
            <td>{{ s.math }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
