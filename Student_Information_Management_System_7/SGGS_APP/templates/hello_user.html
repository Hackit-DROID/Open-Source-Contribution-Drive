<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello User</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5); /* soft aqua to lavender */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      text-align: center;
      width: 400px;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      color: #444;
      margin-bottom: 15px;
      font-size: 28px;
    }

    p {
      font-size: 18px;
      color: #007bff;
      margin-bottom: 25px;
      font-weight: 500;
    }

    input[type="text"] {
      width: 90%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 20px;
      outline: none;
      transition: border 0.3s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0,123,255,0.3);
    }

    button {
      background: linear-gradient(90deg, #007bff, #00c6ff);
      color: #fff;
      border: none;
      padding: 12px 22px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      background: linear-gradient(90deg, #0056b3, #0096c7);
    }

    /* Subtle animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Small text at bottom */
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 Hello User</h1>
    <p>{{ message }}</p>

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Enter your name" required>
      <br>
      <button type="submit">✨ Say Hello</button>
    </form>

    <div class="note">We’re happy to see you here 💙</div>
  </div>
</body>
</html>
