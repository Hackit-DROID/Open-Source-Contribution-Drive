<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Students</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #ACB6E5); /* fresh blue-lavender gradient */
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 950px;
      margin: 50px auto;
      background: #fff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      text-align: center;
      color: #007bff;
      margin-bottom: 25px;
      font-size: 32px;
    }

    form {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    input[type="text"] {
      width: 60%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px 0 0 8px;
      font-size: 16px;
      outline: none;
      transition: border 0.3s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0,123,255,0.3);
    }

    input[type="submit"] {
      padding: 12px 20px;
      border: none;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      color: white;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
    }

    input[type="submit"]:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #0056b3, #0096c7);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 14px 18px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 15px;
    }

    th {
      background: #007bff;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    tr:nth-child(even) {
      background-color: #f9fbfd;
    }

    tr:hover {
      background-color: #f1f9ff;
      transition: 0.2s;
    }

    .empty {
      text-align: center;
      font-size: 18px;
      color: #888;
      margin-top: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Search Students</h1>

    <form method="get">
      <input type="text" name="student_name" placeholder="Enter student name..." value="{{ search_query }}">
      <input type="submit" value="Search">
    </form>

    {% if students %}
      <table>
        <thead>
          <tr>
            <th>Reg. No</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Physics</th>
            <th>Chemistry</th>
            <th>Maths</th>
          </tr>
        </thead>
        <tbody>
          {% for s in students %}
          <tr>
            <td>{{ s.regno }}</td>
            <td>{{ s.student_name }}</td>
            <td>{{ s.branch }}</td>
            <td>{{ s.phy }}</td>
            <td>{{ s.chem }}</td>
            <td>{{ s.math }}</td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="6" class="empty">No students found.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p class="empty">No students to display.</p>
    {% endif %}
  </div>
</body>
</html>
