<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <style>
        /* General page setup */
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 0;
    text-align: center;
    color: #333;
}

/* Page heading */
h1 {
    background: #3498db;
    color: white;
    padding: 20px 10px;
    margin: 0;
    font-size: 28px;
    border-bottom: 4px solid #2980b9;
}
/* Page heading */
h2 {
    background: #3498db;
    color: white;
    padding: 20px 10px;
    margin: 0;
    font-size: 14px;
    border-bottom: 4px solid #2980b9;
}

/* Intro paragraph */
p {
    margin: 20px 0 10px;
    font-size: 18px;
    color: #555;
}

/* Navigation list */
ul {
    list-style: none;
    padding: 0;
    margin: 30px auto;
    max-width: 400px;
}

ul li {
    margin: 15px 0;
}

/* Buttons styled as links */
ul li a {
    display: block;
    text-decoration: none;
    background: #3498db;
    color: white;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.3s ease, transform 0.2s ease;
}

/* Hover effect */
ul li a:hover {
    background: #2980b9;
    transform: scale(1.05);
}

/* Mobile responsiveness */
@media (max-width: 600px) {
    h1 {
        font-size: 22px;
        padding: 15px;
    }

    ul {
        max-width: 90%;
    }

    ul li a {
        font-size: 14px;
        padding: 10px;
    }
}

    </style>
</head>
<body>
    <h1>Welcome to Student Marks Management System</h1>
    <h3>Developed By : Mohammed Aamer</h3>
    <h3>Reg. No : 2023BIT064</h3>
    <p>Click On Navigate to other pages:</p>
    <ul>
    <li><a href="{% url 'student_list' %}">All Students</a></li>
    <li><a href="{% url 'topper_view' %}">Toppers</a></li>
    <li><a href="{% url 'search_name' %}">Search Student</a></li>
    <li><a href="{% url 'numpy' %}">NumPy Operations</a></li>
    <!-- <li><a href="{% url 'sggs' %}">SGGS Page</a></li> -->
</ul>

</body>
</html>
