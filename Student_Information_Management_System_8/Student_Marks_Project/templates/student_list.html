<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
    <style>
        /* General Page Styling */
body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background: #f9fafc;
    color: #333;
}

/* Heading */
h1 {
    text-align: center;
    margin: 20px 0;
    font-size: 28px;
    color: #2c3e50;
    letter-spacing: 1px;
    text-transform: uppercase;
}

/* Table Styling */
table {
    border-collapse: collapse;
    width: 80%;
    margin: 20px auto;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
}

th, td {
    padding: 12px 15px;
    text-align: center;
    font-size: 15px;
    border-bottom: 1px solid #ddd;
}

/* Header Row */
th {
    background: #1abc9c;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Zebra Stripe Rows */
tr:nth-child(even) {
    background: #f2f2f2;
}

/* Hover Effect */
tr:hover {
    background: #eafaf7;
    transition: 0.3s;
}

/* Responsive Design */
@media (max-width: 768px) {
    table {
        width: 95%;
        font-size: 13px;
    }
    th, td {
        padding: 8px;
    }
    h1 {
        font-size: 22px;
    }
}

    </style>
</head>
<body>
    <h1>Student Data</h1>
    <table>
        <tr>
            <th>Reg No</th>
            <th>Name</th>
            <th>Branch</th>
            <th>Math</th>
            <th>Physics</th>
            <th>Chemistry</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.reg_no }}</td>
            <td>{{ student.student_name }}</td>
            <td>{{ student.branch }}</td>
            <td>{{ student.math }}</td>
            <td>{{ student.phy }}</td>
            <td>{{ student.chem }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
