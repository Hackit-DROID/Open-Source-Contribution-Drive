{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Delete</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ff5b5b, #ff9068);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    .delete-box {
      background: #fff;
      color: #333;
      padding: 40px;
      border-radius: 14px;
      width: 420px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #e14a4a;
      margin-bottom: 20px;
    }

    p {
      font-size: 1rem;
      margin-bottom: 30px;
      color: #555;
    }

    form {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      font-size: 1rem;
    }

    .btn-delete {
      background: #ff5b5b;
      color: #fff;
    }

    .btn-delete:hover {
      background: #e14a4a;
    }

    .btn-cancel {
      background: #ccc;
      color: #333;
    }

    .btn-cancel:hover {
      background: #b5b5b5;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #3a8ef6;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="delete-box">
    <h2>Delete Confirmation</h2>
    <p>Are you sure you want to delete <strong>{{ student.name }}</strong>?</p>
    <form method="POST">
      {% csrf_token %}
      <button type="submit" class="btn-delete">Yes, Delete</button>
      <a href="{% url 'dashboard' %}" class="btn-cancel">Cancel</a>
    </form>
  </div>
</body>
</html>
