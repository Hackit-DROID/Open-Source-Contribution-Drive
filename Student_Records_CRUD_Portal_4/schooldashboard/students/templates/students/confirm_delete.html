<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff5f6;
            margin: 40px;
        }
        h2 {
            color: #b83b5e;
        }
        form {
            background: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(184, 59, 94, 0.07);
            max-width: 400px;
            margin-bottom: 18px;
        }
        button {
            margin-top: 16px;
            padding: 8px 24px;
            background: #b83b5e;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background: #911744;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            background: #ffd6e0;
            color: #b83b5e;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 15px;
        }
        a:hover {
            background: #f5c6cb;
            color: #862746;
        }
    </style>
</head>
<body>
<h2>Are you sure you want to delete {{ object.name }}?</h2>
<form method="post">{% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>
<a href="{% url 'display' %}">Cancel</a>
</body>
</html>
