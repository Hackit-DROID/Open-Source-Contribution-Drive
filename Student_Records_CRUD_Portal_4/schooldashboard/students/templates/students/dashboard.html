<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>
    <style>
    body { font-family: Arial, sans-serif; background: #f8fafc; margin: 40px; }
    h1 { color: #2c3e50; margin-bottom: 10px; }
    a { background: #3498db; color: #fff; padding: 6px 14px; text-decoration: none; border-radius: 4px; margin-right: 8px; }
    a:hover { background: #217dbb; }
    form { margin-bottom: 14px; }
    input[name="q"], select { padding: 6px; border-radius: 4px; border: 1px solid #bfc9d1; margin-right: 8px; }
    button { padding: 6px 12px; background: #2ecc71; color: #fff; border: none; border-radius: 4px; margin-right: 8px; cursor: pointer;}
    button:hover { background: #27ae60; }
    table { border-collapse: collapse; width: 100%; background: #fff; box-shadow: 0 2px 8px rgba(44, 62, 80, 0.08); }
    th, td { border: 1px solid #d3dde8; padding: 8px 12px; text-align: left; }
    th { background: #3977ca; color: #fff; }
    tr:nth-child(even) { background: #f0f5fa; }
    tr:hover { background: #d4ecff; }
    </style>
</head>
<body>
<h1>Student Dashboard</h1>
<a href="{% url 'add' %}">Add Student</a>
<form method="get">
    <input name="q" placeholder="Search by name" value="{{ request.GET.q }}">
    <button type="submit">Search</button>
    <select name="sort" onchange="this.form.submit()">
        <option value="">Sort By</option>
        <option value="name">Name</option>
        <option value="marks">Marks</option>
    </select>
</form>
<table>
<tr>
    <th>Name</th><th>RegNo</th><th>Class</th><th>Branch</th>
    <th>Year</th><th>Sub</th><th>Marks</th><th>Grade</th><th>College</th><th>Actions</th>
</tr>
{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.regno }}</td>
    <td>{{ s.student_class }}</td>
    <td>{{ s.branch }}</td>
    <td>{{ s.year }}</td>
    <td>{{ s.sub }}</td>
    <td>{{ s.marks }}</td>
    <td>{{ s.grade }}</td>
    <td>{{ s.college }}</td>
    <td>
        <a href="{% url 'edit' s.id %}">Edit</a>
        <a href="{% url 'delete' s.id %}">Delete</a>
    </td>
</tr>
{% empty %}
<tr><td colspan="10">No students found.</td></tr>
{% endfor %}
</table>
</body>
</html>
