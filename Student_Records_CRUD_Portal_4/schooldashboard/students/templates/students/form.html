<!DOCTYPE html>
<html>
<head>
    <title>Add/Edit Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5faff;
            margin: 40px;
        }
        h2 {
            color: #276678;
        }
        form {
            background: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(39, 102, 120, 0.08);
            max-width: 400px;
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-top: 15px;
            color: #1b3a4b;
        }
        input, select {
            width: 100%;
            padding: 8px 12px;
            margin-top: 6px;
            border-radius: 4px;
            border: 1px solid #bfc9d1;
        }
        button {
            margin-top: 16px;
            padding: 8px 24px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #217dbb;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            background: #c7ecee;
            color: #276678;
            padding: 8px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 15px;
        }
        a:hover {
            background: #b2bec3;
            color: #27496d;
        }
    </style>
</head>
<body>
<h2>{% if view.object %}Edit{% else %}Add{% endif %} Student</h2>
<form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'display' %}">Back</a>
</body>
</html>
