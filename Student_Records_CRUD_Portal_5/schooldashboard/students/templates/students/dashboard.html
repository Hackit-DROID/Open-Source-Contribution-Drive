<head>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
</head>
<h1>Student Dashboard</h1>

<a href="{% url 'add' %}">Add Student</a>

<form method="get">
  <input name="q" placeholder="Search by name" />
  <button type="submit">Search</button>
  <select name="sort" onchange="this.form.submit()">
    <option value="">Sort By</option>
    <option value="name">Name</option>
    <option value="marks">Marks</option>
  </select>
</form>

<table border="1">
  <tr>
    <th>Name</th>
    <th>RegNo</th>
    <th>Class</th>
    <th>Branch</th>
    <th>Year</th>
    <th>Sub</th>
    <th>Marks</th>
    <th>Grade</th>
    <th>College</th>
    <th>Actions</th>
  </tr>
  {% for s in students %}
  <tr>
    <td>{{ s.name }}</td>
    <td>{{ s.regno }}</td>
    <td>{{ s.student_class }}</td>
    <td>{{ s.branch }}</td>
    <td>{{ s.year }}</td>
    <td>{{ s.sub }}</td>
    <td>{{ s.marks }}</td>
    <td>{{ s.grade }}</td>
    <td>{{ s.college }}</td>
    <td>
      <a href="{% url 'edit' s.id %}">Edit</a>
      <a href="{% url 'delete' s.id %}">Delete</a>
    </td>
  </tr>
  {% endfor %}
</table>
