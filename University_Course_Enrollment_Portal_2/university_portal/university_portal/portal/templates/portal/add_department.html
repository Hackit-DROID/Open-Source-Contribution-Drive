{% extends 'portal/base.html' %}

{% block title %}Add Department - University Portal{% endblock %}

{% block content %}
<div class="card-header-custom">
    <h2 class="card-title">🏫 Add New Department</h2>
    <a href="{% url 'departments_list' %}" class="btn btn-outline-primary">← Back to Departments</a>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="dept_name" class="form-label">Department Name</label>
                <input type="text" class="form-control" id="dept_name" name="dept_name" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="building" class="form-label">Building</label>
                <input type="text" class="form-control" id="building" name="building" required>
            </div>
        </div>
    </div>
    <div class="mb-3">
        <label for="budget" class="form-label">Budget</label>
        <input type="number" class="form-control" id="budget" name="budget" required>
    </div>
    <button type="submit" class="btn btn-primary">Add Department</button>
</form>
{% endblock %}
