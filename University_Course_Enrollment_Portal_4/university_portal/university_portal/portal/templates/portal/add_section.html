{% extends 'portal/base.html' %}

{% block title %}Add Section - University Portal{% endblock %}

{% block content %}
<div class="card-header-custom">
    <h2 class="card-title">📅 Add New Section</h2>
    <a href="{% url 'sections_timetable' %}" class="btn btn-outline-primary">← Back to Timetable</a>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="course_id" class="form-label">Course</label>
                <select class="form-control" id="course_id" name="course_id" required>
                    <option value="">Select Course</option>
                    {% for course in courses %}
                        <option value="{{ course.course_id }}">{{ course.course_id }} - {{ course.title }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="sec_id" class="form-label">Section ID</label>
                <input type="text" class="form-control" id="sec_id" name="sec_id" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="semester" class="form-label">Semester</label>
                <select class="form-control" id="semester" name="semester" required>
                    <option value="">Select Semester</option>
                    <option value="Fall">Fall</option>
                    <option value="Spring">Spring</option>
                    <option value="Summer">Summer</option>
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="year" class="form-label">Year</label>
                <input type="number" class="form-control" id="year" name="year" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="mb-3">
                <label for="building" class="form-label">Building</label>
                <input type="text" class="form-control" id="building" name="building" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label for="room_no" class="form-label">Room Number</label>
                <input type="text" class="form-control" id="room_no" name="room_no" required>
            </div>
        </div>
        <div class="col-md-4">
            <div class="mb-3">
                <label for="time_slot_id" class="form-label">Time Slot ID</label>
                <input type="number" class="form-control" id="time_slot_id" name="time_slot_id" required>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Add Section</button>
</form>
{% endblock %}
