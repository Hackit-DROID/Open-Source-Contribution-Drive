{% extends 'portal/base.html' %}

{% block title %}Add Instructor - University Portal{% endblock %}

{% block content %}
<div class="card-header-custom">
    <h2 class="card-title">👨🏫 Add New Instructor</h2>
    <a href="{% url 'instructors_list' %}" class="btn btn-outline-primary">← Back to Instructors</a>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="ID" class="form-label">Instructor ID</label>
                <input type="number" class="form-control" id="ID" name="ID" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="dept_name" class="form-label">Department</label>
                <select class="form-control" id="dept_name" name="dept_name" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                        <option value="{{ dept.dept_name }}">{{ dept.dept_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="salary" class="form-label">Salary</label>
                <input type="number" class="form-control" id="salary" name="salary" required>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Add Instructor</button>
</form>
{% endblock %}
