<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}University Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: bold; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table th { background-color: #f8f9fa; }
        .btn-primary { background-color: #2c3e50; border-color: #2c3e50; }
        .btn-primary:hover { background-color: #34495e; border-color: #34495e; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🎓 University Portal</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}"><i class="bi bi-house"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'instructors_list' %}"><i class="bi bi-person-badge"></i> Instructors</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'courses_list' %}"><i class="bi bi-book"></i> Courses</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'students_list' %}"><i class="bi bi-mortarboard"></i> Students</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'departments_list' %}"><i class="bi bi-building"></i> Departments</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'classrooms_list' %}"><i class="bi bi-door-open"></i> Classrooms</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'sections_timetable' %}"><i class="bi bi-calendar3"></i> Timetable</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'search' %}"><i class="bi bi-search"></i> Search</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container my-4">
        <div class="card">
            <div class="card-body">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
