{% extends 'portal/base.html' %}

{% block title %}Add Course - University Portal{% endblock %}

{% block content %}
<div class="card-header-custom">
    <h2 class="card-title">📘 Add New Course</h2>
    <a href="{% url 'courses_list' %}" class="btn btn-outline-primary">← Back to Courses</a>
</div>

<form method="post">
    {% csrf_token %}
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="course_id" class="form-label">Course ID</label>
                <input type="text" class="form-control" id="course_id" name="course_id" required>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="title" class="form-label">Course Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="dept_name" class="form-label">Department</label>
                <select class="form-control" id="dept_name" name="dept_name" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                        <option value="{{ dept.dept_name }}">{{ dept.dept_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="credits" class="form-label">Credits</label>
                <input type="number" class="form-control" id="credits" name="credits" required>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Add Course</button>
</form>
{% endblock %}
